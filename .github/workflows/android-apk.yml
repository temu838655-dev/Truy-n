
name: Build MANGA WORLD APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ls -lah
          test -f manga-world-source.zip
          unzip -l manga-world-source.zip | head -40

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract source
        run: |
          mkdir source
          unzip -q manga-world-source.zip -d source
          find source -maxdepth 3 -name package.json

      - name: Locate project and build
        run: |
          PROJECT=$(find source -name package.json -not -path '*/node_modules/*' | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          cd "$PROJECT"
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-world-debug-apk
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
