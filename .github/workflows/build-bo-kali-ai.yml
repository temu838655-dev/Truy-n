name: Build BO Kali AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bo-kali-ai/**"
      - ".github/workflows/build-bo-kali-ai.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: bo-kali-ai
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BO-KALI-AI-DEBUG-APK
          path: bo-kali-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bo-kali-ai-latest"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "BO Kali AI — bản mới nhất" --notes "APK mới nhất được build tự động từ nhánh main. Mã nguồn: $GITHUB_SHA" --prerelease
          else
            gh release create "$TAG" "bo-kali-ai/app/build/outputs/apk/debug/app-debug.apk" --title "BO Kali AI — bản mới nhất" --notes "APK mới nhất được build tự động từ nhánh main. Mã nguồn: $GITHUB_SHA" --prerelease
          fi
          gh release upload "$TAG" "bo-kali-ai/app/build/outputs/apk/debug/app-debug.apk" --clobber

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="bo-kali-ai/app/build/outputs/apk/debug/app-debug.apk"
          TAG="bo-kali-ai-v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --title "BO Kali AI v0.1.${GITHUB_RUN_NUMBER}" \
            --notes "Bản build tự động từ nhánh main. Commit: ${GITHUB_SHA}. APK debug để cài thử nghiệm."
