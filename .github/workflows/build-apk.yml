name: Build MANGA WORLD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Extract source archive
        run: |
          if [ -f "manga-world-source.zip" ]; then
            unzip -o manga-world-source.zip
          fi
          echo "== Root directory =="
          ls -la
          if [ ! -d "manga-world" ]; then
            echo "::error::Folder 'manga-world' not found. Check manga-world-source.zip or the repo layout."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies and build web
        working-directory: manga-world
        run: |
          npm install
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        working-directory: manga-world/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANGA-WORLD-APK
          path: manga-world/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
