name: Build MANGA WORLD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          if [ -f "manga-world-source.zip" ]; then
            unzip -o manga-world-source.zip
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies & Build
        run: |
          cd manga-world
          npm install
          npm run build
          npm run android:add || true
          npm run android:sync

      - name: Build APK
        run: |
          cd manga-world/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANGA-WORLD-APK
          path: manga-world/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
